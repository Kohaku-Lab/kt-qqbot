# A QQ chat member with no built-in character.
#
# Run:   kt run @kt-qqbot/creatures/qq-group-chat   (or start it from kt serve)
# Login: kt-qqbot login
# Character: put character.md (and optional character/*.md) in
#            ~/.kohakuterrarium/qq-bot/ ; the qq_character plugin adds them.

name: qq-group-chat
version: "0.1.0"

controller:
  llm: "${KT_LLM_PROFILE:}"
  tool_format: native
  ephemeral: false
  max_messages: 0

system_prompt_file: prompts/system.md

# QQ chat arrives through the qq_feed trigger, not through input.
input:
  type: none

# Plain text is private thought: it shows in the console / dashboard only.
output:
  type: stdout

triggers:
  - name: qq_feed
    type: package
    module: kt_qqbot.trigger
    class: QQFeedTrigger
    conversations: all
    wake: ambient
    quiet_period: 20
    every_n: 8
    cooldown: 60
    batch_delay: 1.0
    backfill: 20

tools:
  - name: qq_send
    type: package
    module: kt_qqbot.tools
    class: QQSendTool
  - name: qq_history
    type: package
    module: kt_qqbot.tools
    class: QQHistoryTool
  - name: qq_sticker
    type: package
    module: kt_qqbot.media_tools
    class: QQStickerTool
  - name: qq_image_search
    type: package
    module: kt_qqbot.media_tools
    class: QQImageSearchTool
  # Read-only web access. qq_web_guard (below) refuses fetches to private or
  # local addresses, because QQ users can steer this creature.
  - name: web_search
    type: builtin
  - name: web_fetch
    type: builtin

plugins:
  # Under kt serve a dashboard-started creature is privileged and gets graph
  # (group_*) and Drive (drive_*) tools; QQ users must not reach them.
  - name: qq_guard
    type: package
    module: kt_qqbot.plugins.guard
    class: QQGuardPlugin
  - name: qq_web_guard
    type: package
    module: kt_qqbot.plugins.web_guard
    class: QQWebGuardPlugin
  - name: qq_character
    type: package
    module: kt_qqbot.plugins.character
    class: QQCharacterPlugin
  - name: qq_status
    type: package
    module: kt_qqbot.plugins.status
    class: QQStatusPlugin
