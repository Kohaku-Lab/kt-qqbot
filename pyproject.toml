[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kt-qqbot"
version = "0.1.3"
description = "KohakuTerrarium QQ bot package: a chat feed trigger and explicit reply tools."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "kohakuterrarium>2.1.8",
    "httpx>=0.27",
    "websockets>=13",
    "cryptography>=42",
    "qrcode>=7.4",
    "kohakuvault>=1.1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
voice = ["graiax-silkcoder>=0.3"]

[project.scripts]
kt-qqbot = "kt_qqbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kt_qqbot"]

[tool.ruff.lint]
select = ["F401", "F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: talks to the real QQ platform (set KT_QQBOT_LIVE=1)"]
